; Compila firmware/carro_rc/carro_rc.ino tal como está (sin copiarlo a src/).
[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Abrir el monitor serie no debe reiniciar la placa (DTR/RTS controlan EN y GPIO0).
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<*> -<.pio/> -<escenarios/> -<pruebas/>
