name: 'golpe'
version: 1
author: 'Grupo 11'
# Golpe frontal: ax = 2,5 g (24,5 m/s²) durante 300 ms; rearme 2 s después.
steps:
  - wait-serial: 'CAL OK'
  - wait-serial: 'SESION id='
  - delay: 1000ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 2.5
  - set-control:
      part-id: imu1
      control: accelY
      value: 0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1
  - delay: 250ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 1
  - delay: 50ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1
  - delay: 2000ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 0
  - delay: 150ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 0
  - delay: 1900ms
  # fin golpe
