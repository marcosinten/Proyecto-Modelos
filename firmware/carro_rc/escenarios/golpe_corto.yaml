name: 'golpe_corto'
version: 1
author: 'Grupo 11'
# Golpe breve: ax = 2,5 g (24,5 m/s²) durante 12 ms (3 lecturas de 250 Hz); rearme 2 s después.
steps:
  - wait-serial: 'CAL OK'
  - wait-serial: 'SESION id='
  - delay: 1000ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 2.5
  - set-control:
      part-id: imu1
      control: accelY
      value: 0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1
  - delay: 12ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1
  - delay: 88ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 1
  - delay: 1900ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 0
  - delay: 150ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 0
  - expect-pin:
      part-id: esp
      pin: 'D27'
      value: 0
  - delay: 1700ms
  # fin golpe_corto
