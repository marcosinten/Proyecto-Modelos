      value: 0.7071
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.7071
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.5
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.866
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.2588
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.9659
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1.0
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: rotationX
      value: 0
  - set-control:
      part-id: imu1
      control: rotationY
      value: 0
  - delay: 2440ms
  # fin vuelco_costado
