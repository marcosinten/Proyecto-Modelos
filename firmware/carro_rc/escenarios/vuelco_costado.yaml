name: 'vuelco_costado'
version: 1
author: 'Grupo 11'
# Vuelco de costado: roll = 90° (ay = 1 g, az = 0) durante 7 s; rearme volcado; regreso; detector listo.
steps:
  - wait-serial: 'CAL OK'
  - wait-serial: 'SESION id='
  - delay: 1000ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 1.0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.0
  - delay: 300ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 1
  - delay: 5200ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 0
  - delay: 150ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 0
  - delay: 1200ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1.0
  - delay: 2500ms
  # fin vuelco_costado
