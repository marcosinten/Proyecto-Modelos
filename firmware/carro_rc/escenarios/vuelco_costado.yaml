name: 'vuelco_costado'
version: 1
author: 'Grupo 11'
# Vuelco de costado: roll = 90° (ay = 1 g, az = 0) durante 7 s; rearme volcado; regreso; detector listo.
steps:
  - wait-serial: 'CAL OK'
  - wait-serial: 'SESION id='
  - delay: 1000ms
  - set-control:
      part-id: imu1
      control: rotationX
      value: 1500.0
  - set-control:
      part-id: imu1
      control: rotationY
      value: -0.0
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.2588
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.9659
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.5
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.866
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.7071
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.7071
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.866
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.5
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.9659
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.2588
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 1.0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.0
  - delay: 10ms
  - set-control:
      part-id: imu1
      control: rotationX
      value: 0
  - set-control:
      part-id: imu1
      control: rotationY
      value: 0
  - delay: 240ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 1
  - delay: 5200ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 0
  - delay: 150ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 0
  - delay: 1200ms
  - set-control:
      part-id: imu1
      control: rotationX
      value: -1500.0
  - set-control:
      part-id: imu1
      control: rotationY
      value: -0.0
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.9659
  - set-control:
      part-id: imu1
      control: accelZ
