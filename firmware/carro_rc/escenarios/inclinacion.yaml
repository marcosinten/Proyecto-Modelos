name: 'inclinacion'
version: 1
author: 'Grupo 11'
# Inclinación lateral roll = 70° durante 2 s y regreso a 0°; rearme.
steps:
  - wait-serial: 'CAL OK'
  - wait-serial: 'SESION id='
  - delay: 1000ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.9397
  - set-control:
      part-id: imu1
      control: accelZ
      value: 0.342
  - delay: 300ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 1
  - delay: 1700ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0.0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1.0
  - delay: 1500ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 0
  - delay: 150ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 0
  - delay: 1700ms
  # fin inclinacion
