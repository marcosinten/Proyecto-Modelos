name: 'vuelco_boca_abajo'
version: 1
author: 'Grupo 11'
# Boca abajo: az = -1 g (roll = 180°) durante 4 s; regreso; rearme.
steps:
  - wait-serial: 'CAL OK'
  - wait-serial: 'SESION id='
  - delay: 1000ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0
  - set-control:
      part-id: imu1
      control: accelZ
      value: -1
  - delay: 300ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 1
  - delay: 3700ms
  - set-control:
      part-id: imu1
      control: accelX
      value: 0
  - set-control:
      part-id: imu1
      control: accelY
      value: 0
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1
  - delay: 1000ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: btn_rearme
      control: pressed
      value: 0
  - delay: 150ms
  - expect-pin:
      part-id: led1
      pin: 'A'
      value: 0
  - delay: 1700ms
  # fin vuelco_boca_abajo
